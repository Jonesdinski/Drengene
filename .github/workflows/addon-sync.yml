name: Build Lejrbalet Addon
on:
  push:
    branches: [main]
    paths: ['addon/**', '.github/workflows/addon-sync.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check original addon capture logic
        run: lua5.1 addon/tests/capture.lua
      - name: Package addon
        run: cd addon && zip -r LejrbaletSync-Addon.zip LejrbaletSync -x '*.svg'
      - uses: actions/upload-artifact@v4
        with:
          name: LejrbaletSync-Addon
          path: addon/LejrbaletSync-Addon.zip
      - name: Publish addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view addon-v0.4.0 >/dev/null 2>&1 || gh release create addon-v0.4.0 --target '${{ github.sha }}' --title 'Lejrbalet Sync Addon 0.4.0' --notes-file addon/README.md
          gh release upload addon-v0.4.0 addon/LejrbaletSync-Addon.zip --clobber
